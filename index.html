<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TablSide</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Raleway:wght@300;400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --bg:#f4f2ee; --border:#d6d0c6; --text:#1a1612; --muted:#8a8278; --teal:#273534; }
  body { font-family:'Raleway',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem 1.5rem; }
  .wrap { width:100%; max-width:340px; text-align:center; }
  .title { font-family:'Cormorant Garamond',serif; font-size:2rem; font-weight:400; color:var(--teal); letter-spacing:0.15em; text-transform:uppercase; margin-bottom:0.75rem; }
  .line { font-size:0.75rem; color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:2.5rem; line-height:1.8; }
  .btn { display:block; width:100%; padding:1rem; background:var(--teal); color:#fff; font-size:0.72rem; font-weight:500; letter-spacing:0.2em; text-transform:uppercase; text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">TablSide</div>
  <div class="line">For tableside magicians</div>
  <a class="btn" href="login.html">Sign in</a>
</div>
</body>
</html>
