<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#273534">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TablSide">
<title>Admin | TablSide</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Raleway:wght@300;400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#f4f2ee; --surface:#fff; --surface2:#ede9e2; --border:#d6d0c6;
    --text:#1a1612; --muted:#8a8278; --gold:#7a6545; --teal:#273534;
    --plum:#6f0f43; --red:#a01a1a;
  }
  body { font-family:'Raleway',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:1.25rem 1rem 3rem; max-width:500px; margin:0 auto; }

  /* HEADER */
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; }
  .header-title { font-family:'Cormorant Garamond',serif; font-size:1.1rem; font-weight:400; color:var(--teal); letter-spacing:0.15em; text-transform:uppercase; }

  /* MAP */
  .map-container { width:100%; background:var(--surface2); border:1px solid var(--border); min-height:80px; position:relative; overflow:hidden; margin-bottom:1.25rem; cursor:pointer; }
  .map-container.swipeable { touch-action:pan-y; }
  .map-container img { display:block; width:100%; height:100%; object-fit:contain; -webkit-user-drag:none; }
  .map-placeholder { display:flex; align-items:center; justify-content:center; min-height:80px; padding:2rem; }
  .map-placeholder-text { font-size:0.68rem; color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; text-align:center; }
  .map-change-btn { position:absolute; bottom:8px; right:8px; background:rgba(255,255,255,0.92); border:1px solid var(--border); color:var(--muted); font-family:'Raleway',sans-serif; font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase; padding:4px 10px; cursor:pointer; -webkit-tap-highlight-color:transparent; }

  /* HEADING TO BAR */
  .heading-bar { display:none; background:var(--plum); padding:0.85rem 1rem; margin-bottom:1.25rem; flex-direction:row; align-items:center; justify-content:space-between; }
  .heading-bar-label { font-size:0.6rem; font-weight:500; letter-spacing:0.15em; text-transform:uppercase; color:rgba(255,255,255,0.6); margin-bottom:0.2rem; }
  .heading-bar-table { font-family:'Cormorant Garamond',serif; font-size:1.2rem; color:#fff; }
  .heading-bar-timer { font-size:0.6rem; color:rgba(255,255,255,0.5); letter-spacing:0.1em; text-transform:uppercase; }

  /* QUEUE */
  .queue-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:0.6rem; }
  .queue-label { font-size:0.65rem; font-weight:500; color:var(--muted); letter-spacing:0.15em; text-transform:uppercase; }
  .queue-count { width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.65rem; font-weight:600; background:var(--plum); color:#fff; }
  .queue-count.empty { background:var(--surface2); color:var(--muted); border:1px solid var(--border); }
  .queue-list { width:100%; border:1px solid var(--border); background:var(--surface); margin-bottom:0.5rem; overflow:hidden; }
  .queue-empty { padding:1.5rem; text-align:center; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:0.9rem; color:var(--muted); }
  .queue-entry { display:flex; align-items:center; justify-content:space-between; padding:0.8rem 1rem; border-bottom:1px solid var(--border); }
  .queue-entry:last-child { border-bottom:none; }
  .queue-entry.is-top { background:#faf8f4; }
  .entry-left { display:flex; flex-direction:column; gap:0.15rem; }
  .entry-name { font-size:0.88rem; font-weight:600; color:var(--text); }
  .entry-name.scan { font-weight:400; color:var(--muted); }
  .entry-wait { font-size:0.6rem; color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; }
  .on-my-way-btn { background:var(--plum); border:none; color:#fff; font-family:'Raleway',sans-serif; font-size:0.6rem; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; padding:0.5rem 0.9rem; cursor:pointer; white-space:nowrap; -webkit-tap-highlight-color:transparent; min-height:36px; }
  .cancel-notices { margin-bottom:1rem; display:flex; flex-direction:column; gap:4px; }
  .cancel-notice { font-size:0.65rem; color:var(--red); letter-spacing:0.1em; text-transform:uppercase; padding:0.5rem 0.75rem; background:#fff5f5; border:1px solid #f5c0c0; transition:opacity 0.5s; }

  /* COLLAPSIBLE */
  .collapse-toggle { width:100%; display:flex; align-items:center; justify-content:space-between; padding:0.8rem 1rem; background:var(--surface); border:1px solid var(--border); cursor:pointer; font-family:'Raleway',sans-serif; margin-bottom:1px; -webkit-tap-highlight-color:transparent; }
  .collapse-label { font-size:0.65rem; font-weight:500; color:var(--muted); letter-spacing:0.15em; text-transform:uppercase; pointer-events:none; }
  .collapse-arrow { font-size:0.7rem; color:var(--muted); transition:transform 0.2s; pointer-events:none; }
  .collapse-arrow.open { transform:rotate(180deg); }
  .collapse-panel { display:none; background:var(--surface); border:1px solid var(--border); border-top:none; margin-bottom:1rem; }
  .collapse-panel.open { display:block; }

  /* STATS */
  .stats-tabs { display:flex; border-bottom:1px solid var(--border); }
  .stats-tab { flex:1; padding:0.6rem; font-size:0.62rem; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; text-align:center; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; -webkit-tap-highlight-color:transparent; }
  .stats-tab.active { color:var(--teal); border-bottom-color:var(--teal); }
  .month-row { display:none; padding:0.6rem 1rem; border-bottom:1px solid var(--border); }
  .month-row.visible { display:block; }
  .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; padding:1rem; }
  .stat-card { background:var(--surface2); border:1px solid var(--border); padding:0.75rem; display:flex; flex-direction:column; gap:0.25rem; }
  .stat-value { font-family:'Cormorant Garamond',serif; font-size:1.6rem; font-weight:400; color:var(--teal); line-height:1; }
  .stat-label { font-size:0.6rem; color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; line-height:1.4; }

  /* SETTINGS */
  .setting-row { display:flex; align-items:center; justify-content:space-between; padding:0.8rem 1rem; border-bottom:1px solid var(--border); }
  .setting-row:last-of-type { border-bottom:none; }
  .setting-label { font-size:0.7rem; color:var(--muted); letter-spacing:0.08em; }
  .setting-value { font-size:0.7rem; color:var(--gold); min-width:36px; text-align:right; }
  input[type=range] { -webkit-appearance:none; width:90px; height:2px; background:var(--border); outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--teal); cursor:pointer; }
  select { background:var(--surface2); border:1px solid var(--border); color:var(--text); font-family:'Raleway',sans-serif; font-size:0.68rem; padding:4px 8px; outline:none; cursor:pointer; }
  .action-btn { width:calc(100% - 2rem); margin:1rem; padding:0.75rem; background:transparent; border:1px solid var(--teal); color:var(--teal); font-family:'Raleway',sans-serif; font-size:0.68rem; font-weight:500; letter-spacing:0.15em; text-transform:uppercase; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .saved-msg { text-align:center; font-size:0.62rem; color:#2a6a2a; letter-spacing:0.1em; text-transform:uppercase; padding:0 1rem 0.75rem; opacity:0; transition:opacity 0.3s; }
  .saved-msg.show { opacity:1; }
  .error-msg { text-align:center; font-size:0.62rem; color:var(--red); letter-spacing:0.08em; padding:0 1rem 0.75rem; line-height:1.6; }
  .link-row { border:1px solid var(--border); padding:0.65rem; display:flex; flex-direction:column; gap:0.45rem; margin-bottom:0.5rem; }
  .link-screens { display:flex; gap:0.75rem; flex-wrap:wrap; font-size:0.62rem; color:var(--muted); letter-spacing:0.06em; }
  .link-screens label { display:flex; align-items:center; gap:0.3rem; cursor:pointer; }
  .floorplan-row { display:flex; align-items:center; gap:0.5rem; border:1px solid var(--border); padding:0.5rem; margin-bottom:0.5rem; }
  .floorplan-row img { width:52px; height:52px; object-fit:cover; flex-shrink:0; }
  .floorplan-row .fp-label { flex:1; font-size:0.62rem; color:var(--muted); }
  .session-btn { display:block; width:100%; padding:0.75rem; font-family:'Raleway',sans-serif; font-size:0.65rem; font-weight:500; letter-spacing:0.15em; text-transform:uppercase; cursor:pointer; -webkit-tap-highlight-color:transparent; border:1px solid; }
  .session-btn:disabled { opacity:0.45; cursor:not-allowed; }
  .session-btn.off { background:transparent; border-color:#b0a898; color:#6b5f52; }
  .session-btn.on  { background:var(--teal); border-color:var(--teal); color:#fff; }
  .session-status { text-align:center; font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-top:0.4rem; }
  .link-click-row { display:flex; justify-content:space-between; padding:0.4rem 0; border-bottom:1px solid var(--border); font-size:0.7rem; color:var(--text); }
  .link-click-row:last-child { border-bottom:none; }
  .link-click-row .count { color:var(--muted); font-weight:500; }
  .map-viewer { position:relative; width:100%; max-height:40vh; max-height:40dvh; overflow:hidden; user-select:none; -webkit-user-select:none; }
  .map-track { position:absolute; top:0; bottom:0; left:0; width:100%; display:flex; }
  .map-track.multi { width:300%; transform:translateX(-33.333333%); will-change:transform; }
  .map-slide { flex:0 0 100%; min-width:0; height:100%; }
  .map-track.multi .map-slide { flex-basis:33.333333%; }
  .map-dots { position:absolute; left:50%; bottom:0.4rem; transform:translateX(-50%); display:flex; padding:0 0.3rem; border-radius:999px; background:rgba(0,0,0,0.5); z-index:2; }
  .dot-hit { width:24px; height:24px; padding:0; border:none; background:none; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .map-dots .dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.55); }
  .map-dots .dot.active { background:#fff; }
  .map-caption { display:flex; justify-content:space-between; gap:0.75rem; padding:0.45rem 0.7rem; background:var(--surface); border-top:1px solid var(--border); font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }
  .map-caption-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* MODAL */
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100; align-items:center; justify-content:center; padding:1rem; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--surface); border:1px solid var(--border); width:100%; max-width:400px; max-height:85vh; overflow-y:auto; }
  .modal-header { display:flex; align-items:center; justify-content:space-between; padding:1rem; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:1; }
  .modal-title { font-size:0.7rem; font-weight:500; letter-spacing:0.15em; text-transform:uppercase; color:var(--muted); }
  .modal-close { background:none; border:none; font-size:1.4rem; color:var(--muted); cursor:pointer; padding:0 4px; -webkit-tap-highlight-color:transparent; }
  .venue-list { padding:0.5rem 0; }
  .venue-item { display:flex; align-items:center; justify-content:space-between; padding:0.75rem 1rem; border-bottom:1px solid var(--border); }
  .venue-item:last-child { border-bottom:none; }
  .venue-item.active { background:#f0f8f0; }
  .venue-item-name { font-size:0.82rem; font-weight:500; color:var(--text); }
  .venue-item-active-label { font-size:0.6rem; color:#2a6a2a; letter-spacing:0.1em; text-transform:uppercase; }
  .venue-item-id { font-size:0.6rem; color:var(--muted); letter-spacing:0.04em; margin-top:0.15rem; }
  .venue-actions { display:flex; gap:0.4rem; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  .venue-btn { background:none; border:1px solid var(--border); color:var(--muted); font-family:'Raleway',sans-serif; font-size:0.58rem; letter-spacing:0.08em; text-transform:uppercase; padding:5px 8px; cursor:pointer; white-space:nowrap; -webkit-tap-highlight-color:transparent; min-height:32px; }
  .venue-btn.primary { color:var(--teal); border-color:var(--teal); }
  .venue-btn.danger { color:var(--red); border-color:var(--red); }
  .add-venue-form { padding:1rem; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:0.6rem; }
  .form-label { font-size:0.62rem; color:var(--muted); letter-spacing:0.12em; text-transform:uppercase; }
  .text-field { width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text); font-family:'Raleway',sans-serif; font-size:0.78rem; padding:10px; outline:none; }
  .file-label { display:flex; align-items:center; gap:0.5rem; padding:0.6rem 0.75rem; background:var(--surface2); border:1px solid var(--border); cursor:pointer; font-size:0.68rem; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; min-height:40px; }
  .file-label.ready { border-color:var(--teal); color:var(--teal); }
  .primary-btn { padding:0.85rem; background:var(--teal); border:none; color:#fff; font-family:'Raleway',sans-serif; font-size:0.68rem; font-weight:500; letter-spacing:0.15em; text-transform:uppercase; cursor:pointer; min-height:44px; -webkit-tap-highlight-color:transparent; }

  /* CUSTOMIZE */
  .customize-form { padding:1rem; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:0; }
  .customize-title { font-size:0.62rem; color:var(--muted); letter-spacing:0.12em; text-transform:uppercase; margin-bottom:0.75rem; }
  .color-row { display:flex; align-items:center; justify-content:space-between; padding:0.8rem 1rem; border-bottom:1px solid var(--border); gap:0.5rem; }
  .color-row:last-of-type { border-bottom:none; }
  .color-inputs { display:flex; align-items:center; gap:0.5rem; }
  input[type=color] { width:32px; height:28px; border:1px solid var(--border); padding:2px; cursor:pointer; background:none; }
  .hex-input { width:80px; background:var(--surface2); border:1px solid var(--border); color:var(--text); font-family:'Raleway',sans-serif; font-size:0.68rem; padding:4px 6px; outline:none; }
  .short-input { background:var(--surface2); border:1px solid var(--border); color:var(--text); font-family:'Raleway',sans-serif; font-size:0.68rem; padding:5px 8px; outline:none; width:160px; }
  body.pending { visibility:hidden; }
</style>
</head>
<body class="pending">

<div class="header">
  <div class="header-title">Tonight</div>
</div>
<select id="venue-switcher" style="width:100%;margin-bottom:1.25rem;padding:0.6rem;font-family:'Raleway',sans-serif;font-size:0.72rem;letter-spacing:0.05em;background:var(--surface2);border:1px solid var(--border);color:var(--text);">
  <option value="">Select a venue…</option>
</select>

<div class="map-container" id="map-container">
  <div class="map-placeholder"><div class="map-placeholder-text"></div></div>
</div>

<div class="heading-bar" id="heading-bar">

    <div class="heading-bar-label">Heading to</div>

<div class="queue-header">

<div style="margin-bottom:1.5rem;">
  <button id="session-toggle-btn" class="session-btn off" disabled>Begin Performing</button>

</div>

<div class="collapse-toggle" id="settings-toggle">
  <div class="collapse-label">Settings</div>

<div class="collapse-panel" id="settings-panel">

    <div class="setting-label">Alert sound</div>

      <option value="chime">Chime</option>

<div class="modal-overlay" id="push-prompt-modal">
  <div class="modal" style="max-width:340px;">
    <div class="modal-header">
      <div class="modal-title">Notifications</div>
      <button class="modal-close" id="push-prompt-close-btn">&times;</button>
    </div>
    <div style="padding:1.5rem 1.25rem;display:flex;flex-direction:column;gap:1rem;align-items:center;text-align:center;">
      <div style="font-size:0.78rem;color:var(--text);line-height:1.6;">Get notified the moment a table requests you, even when the app isn't open.</div>
      <button class="primary-btn" id="push-prompt-enable-btn" style="width:100%;">Enable Notifications</button>

<script>
  // ─── FIREBASE ───────────────────────────────────────────────────────────────
  firebase.initializeApp({
    apiKey: "AIzaSyA-gHybTx4xZayMGPe7EqujnEEQmYEmwTg",
    authDomain: "tablside-magic.firebaseapp.com",
    projectId: "tablside-magic",
    storageBucket: "tablside-magic.firebasestorage.app",
    messagingSenderId: "209355723420",
    appId: "1:209355723420:web:c4bf8aeab08cc425135359"
  });
  var db = firebase.firestore();
  db.settings({ experimentalAutoDetectLongPolling: true });

  var swRegistrationPromise = null;
  if ('serviceWorker' in navigator) {
    swRegistrationPromise = navigator.serviceWorker.register('sw.js').catch(function() { return null; });
  }

  // ─── PUSH NOTIFICATIONS ─────────────────────────────────────────────────────
  var PUSH_VAPID_KEY = 'BKZ5QfQLA3ECH-vrnHuTcVH3Za-_MGbtmhDQaYFrZdisDJ7hY4ypvf3Gvz4XEclz3pA7my0G_lFsZlesqWGeTHM';
  var messaging = null;
  try {
    if ('serviceWorker' in navigator && 'Notification' in window && firebase.messaging) {
      messaging = firebase.messaging();
    }
  } catch (e) { messaging = null; }

  function updatePushStatus() {
    var el = document.getElementById('push-status');
    var btn = document.getElementById('enable-push-btn');
    if (!messaging) {
      el.textContent = 'Not supported in this browser.';
      btn.disabled = true;
      return;
    }
    if (Notification.permission === 'granted') {
      el.textContent = 'Notifications are on for this device.';
      btn.textContent = 'Notifications Enabled';
      btn.disabled = true;
    } else if (Notification.permission === 'denied') {
      el.textContent = 'Blocked in your browser settings. Enable it there to turn this on.';
      btn.disabled = true;
    } else {
      el.textContent = '';
      btn.textContent = 'Enable Notifications';
      btn.disabled = false;
    }
  }

  function requestPushPermission() {
    if (!messaging || !currentUser) return;
    var statusEl = document.getElementById('push-status');
    Notification.requestPermission().then(function(perm) {
      if (perm !== 'granted') { updatePushStatus(); return; }
      Promise.resolve(swRegistrationPromise).then(function(reg) {
        return messaging.getToken({ vapidKey: PUSH_VAPID_KEY, serviceWorkerRegistration: reg || undefined });
      }).then(function(token) {
        if (!token) { statusEl.textContent = 'Could not enable notifications. Try again.'; return; }
        db.collection('pushTokens').doc(token).set({
          ownerUid: currentUser.uid,
          createdAt: FS.serverTimestamp()
        }).then(updatePushStatus).catch(function() {
          statusEl.textContent = 'Could not save. Check your connection and try again.';
        });
      }).catch(function() {
        statusEl.textContent = 'Could not enable notifications. Try again.';
      });
    });
  }

  document.getElementById('enable-push-btn').addEventListener('click', requestPushPermission);

  // ─── First-run notification prompt (shown once per device) ────────────────
  function closePushPrompt() {
    document.getElementById('push-prompt-modal').classList.remove('open');
  }
  function maybeShowPushPrompt() {
    if (!messaging) return;
    if (Notification.permission !== 'default') return;
    if (localStorage.getItem('pushPromptShown')) return;
    document.getElementById('push-prompt-modal').classList.add('open');
  }
  document.getElementById('push-prompt-enable-btn').addEventListener('click', function() {
    localStorage.setItem('pushPromptShown', '1');
    closePushPrompt();
    requestPushPermission();
  });
  document.getElementById('push-prompt-dismiss-btn').addEventListener('click', function() {
    localStorage.setItem('pushPromptShown', '1');

  // ─── AUDIO ──────────────────────────────────────────────────────────────────
  function playAlert() {

    if (t === 'chime' || t === 'double' || t === 'both') {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();

          g.gain.linearRampToValueAtTime(0.3, ctx.currentTime + start + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
          o.start(ctx.currentTime + start); o.stop(ctx.currentTime + start + dur);

  // ─── VENUES ─────────────────────────────────────────────────────────────────

  // Drag the plan sideways to change rooms. It follows your finger (or mouse) and the
  // neighbouring room slides in beside it. Past a quarter of the width, or with a quick
  // flick, it carries on to that room; otherwise it springs back. Vertical drags are left
  // alone so the page still scrolls.
  (function() {
    var box = document.getElementById('map-container');
    function offset(dx) { return 'translateX(calc(-33.333333% + ' + dx + 'px))'; }

    box.addEventListener('pointerdown', function(e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (e.target.closest('.dot-hit') || !trackEl()) return;
      settleNow();                       // grabbing the plan mid-slide lets that slide finish first
      if (!trackEl()) return;
      drag = { id: e.pointerId, x: e.clientX, y: e.clientY, axis: null, dx: 0,
               w: box.querySelector('.map-viewer').clientWidth, pts: [{ t: e.timeStamp, x: e.clientX }] };
    });
    box.addEventListener('pointermove', function(e) {
      if (!drag || e.pointerId !== drag.id) return;
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.axis) {
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        if (Math.abs(dy) >= Math.abs(dx)) { drag = null; return; } // scrolling the page, not swiping
        drag.axis = 'x';
        try { box.setPointerCapture(e.pointerId); } catch (err) {}
        trackEl().style.transition = 'none';
      }
      drag.dx = Math.max(-drag.w, Math.min(drag.w, dx));
      drag.pts.push({ t: e.timeStamp, x: e.clientX });
      while (drag.pts.length > 2 && e.timeStamp - drag.pts[0].t > 100) drag.pts.shift();
      trackEl().style.transform = offset(drag.dx);
    });
    function release(e, cancelled) {

      var d = drag; drag = null;

      try { box.releasePointerCapture(e.pointerId); } catch (err) {}
      var first = d.pts[0], last = d.pts[d.pts.length - 1];
      var v = last.t > first.t ? (last.x - first.x) / (last.t - first.t) : 0; // pixels per millisecond
      var flick = Math.abs(v) > 0.45 && Math.abs(d.dx) > 24 && (v < 0) === (d.dx < 0);
      var n = currentRooms().length;

  document.getElementById('venue-switcher').addEventListener('change', function() {
    if (this.value) selectVenue(this.value);
  });

  function selectVenue(s) {
    settings.activeVenue = s;
    localStorage.setItem('activeVenue', s);
    document.getElementById('venue-switcher').value = s;
    var v = venues.find(function(v) { return v.slug === s; });
    if (v) {
      activeMapIndex = 0;
      pendingRender = false; pendingTarget = null;
      renderMapViewer();
      ensureRooms(v);
      updateSessionUI();
    }
    subscribeToVenue();
  }

  // Floor plans live in each venue's rooms. A venue that hasn't been opened in
  // the dashboard since rooms were introduced still shows its old photos (no names).
  var ASPECT_RATIOS = { '2:1': 2, '16:9': 16 / 9, '3:2': 1.5, '4:3': 4 / 3 };
  function floorPlanRooms(v) {
    if (!v) return [];
    if (v.roomsLoaded && v.rooms && v.rooms.length) return v.rooms;
    if (!v.legacyRooms) {
      v.legacyRooms = (v.mapUrls || []).map(function(u) { return { name: '', url: u, tables: [], ratio: null }; });
      v.legacyRooms.forEach(function(r) { measureRoom(v, r); });
    }
    return v.legacyRooms;
  }
  function currentRooms() {
    return floorPlanRooms(venues.find(function(v) { return v.slug === settings.activeVenue; }));
  }
  function escText(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function escAttr(s) { return escText(s).replace(/"/g, '&quot;'); }

  function ensureRooms(v) {
    if (!v || v.roomsLoaded || v.roomsLoading) return;
    v.roomsLoading = true;
    db.collection('venues').doc(v.slug).collection('rooms').orderBy('order').get().then(function(snap) {
      v.rooms = snap.docs.map(function(d) {
        var r = d.data();
        return {
          name: r.name || '',
          url: r.imageUrl,
          tables: ((r.design && r.design.numbers) || []).map(function(n) { return String(n.value); }),
          ratio: ASPECT_RATIOS[r.design && r.design.aspect] || null
        };
      }).filter(function(r) { return r.url; });
      v.rooms.forEach(function(r) { measureRoom(v, r); });
    }).catch(function() {
      v.rooms = [];

    });
  }

  // One frame per venue, as tall as its tallest room, so the queue below never moves
  // as you change rooms. Shorter plans sit centred inside it.
  function frameRatio(rooms) {
    var known = rooms.map(function(r) { return r.ratio; }).filter(Boolean);
    return known.length ? Math.min.apply(null, known) : 16 / 9;
  }
  // The picture itself is the truth about its shape, so measure it once it has loaded.
  function measureRoom(v, room) {
    var im = new Image();
    im.onload = function() {

      var before = frameRatio(floorPlanRooms(v));
      room.ratio = im.naturalWidth / im.naturalHeight;

      if (anim || drag) { pendingRender = true; return; }
      renderMapViewer();
    };
    im.src = room.url;
  }

  function slideHtml(room, isCurrent) {
    return '<div class="map-slide' + (isCurrent ? ' current' : '') + '"><img src="' + escAttr(room.url) + '" alt="' +
      escAttr(room.name || 'Floor plan') + '" draggable="false"></div>';
  }
  function renderMapViewer() {
    cancelSlide();
    var v = venues.find(function(v) { return v.slug === settings.activeVenue; });
    var rooms = floorPlanRooms(v);
    if (!rooms.length) { setMapPlaceholder(v && v.roomsLoaded ? 'No floor plan for this venue' : ''); return; }
    if (activeMapIndex >= rooms.length) activeMapIndex = 0;
    var n = rooms.length, cur = rooms[activeMapIndex];
    // With several rooms the track holds the previous, current and next plan side by side.
    var slides = n > 1 ? [rooms[(activeMapIndex + n - 1) % n], cur, rooms[(activeMapIndex + 1) % n]] : [cur];
    var dots = n > 1
      ? '<div class="map-dots">' + rooms.map(function(r, i) {
          return '<button type="button" class="dot-hit" data-index="' + i + '" aria-label="' + escAttr(r.name || ('Room ' + (i + 1))) + '">' +
            '<span class="dot' + (i === activeMapIndex ? ' active' : '') + '"></span></button>';
        }).join('') + '</div>'
      : '';

      ? '<div class="map-caption"><span class="map-caption-name">' + escText(cur.name) + '</span><span class="map-caption-count">' + (activeMapIndex + 1) + ' of ' + n + '</span></div>'
      : '';

      '<div class="map-viewer" style="aspect-ratio:' + frameRatio(rooms).toFixed(4) + '">' +
        '<div class="map-track' + (n > 1 ? ' multi' : '') + '">' +

  }

  // ─── Sliding between rooms ─────────────────────────────────────────────────
  var SLIDE_MS = 250;
  var anim = null;            // a slide that's still settling
  var drag = null;            // a finger (or mouse) that's down on the plan
  var pendingRender = false;  // something wanted a redraw while the plan was moving
  var pendingTarget = null;   // something wanted a different room while the plan was moving
  function trackEl() { return document.querySelector('#map-container .map-track.multi'); }
  function reducedMotion() { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  function slideMs() { return reducedMotion() ? 0 : SLIDE_MS; }
  function cancelSlide() { if (anim) { clearTimeout(anim.timer); anim = null; } }
  function settleNow() { if (anim) anim.finish(); } // jump straight to where the slide was heading

  function showIndicators(index) {
    var rooms = currentRooms();
    var cap = document.querySelector('#map-container .map-caption');
    if (cap && rooms[index]) {
      cap.querySelector('.map-caption-name').textContent = rooms[index].name;
      cap.querySelector('.map-caption-count').textContent = (index + 1) + ' of ' + rooms.length;

    document.querySelectorAll('#map-container .dot').forEach(function(d, i) { d.classList.toggle('active', i === index); });
  }
  function flushPending() {

  function settleTrack(toTransform, done) {

    if (instant || reducedMotion() || !track) { activeMapIndex = target; renderMapViewer(); return; }
    var dir = target > activeMapIndex ? 1 : -1;

  }

  // The plan follows the table you're dealing with: the one you're heading to,
  // otherwise the first request in line. It moves only when that changes, so
  // swiping over to look at another room is never undone behind your back.
  var queueTop = null, headingToTable = null, lastFocusKey = null;
  function roomIndexForTable(table) {
    var rooms = currentRooms();
    for (var i = 0; i < rooms.length; i++) {

    }

  }

  function setMapPlaceholder(text) {

      '<div class="map-placeholder"><div class="map-placeholder-text">' + text + '</div></div>';
  }


  function loadVenues() {
    db.collection('venues').where('ownerUid', '==', currentUser.uid).get().then(function(snap) {
      venues = snap.docs.map(function(d) {
        var data = d.data();
        return { name: data.name, slug: d.id, colors: data.colors || {}, links: data.links || [], tables: data.tables || [], mapUrls: data.mapUrls || [], sessionActive: data.sessionActive === true };
      });
      var sw = document.getElementById('venue-switcher');
      sw.innerHTML = '<option value="">Select a venue…</option>' + venues.map(function(v) {
        return '<option value="' + v.slug + '">' + v.name + '</option>';
      }).join('');

        var v = venues.find(function(v) { return v.slug === settings.activeVenue; });

        }

      }

  }

  function subscribeToVenue() {
    if (!settings.activeVenue) return;
    if (unsubscribe) unsubscribe();
    entries = [];

    unsubscribe = db.collection('venues').doc(settings.activeVenue).collection('tables')
      .onSnapshot(function(snapshot) {

      });

  function handleUpdate(data) {
    var label = 'Table ' + data.table;
    var existing = entries.find(function(e) { return e.id === data.id; });
    var FIVE_MIN = 5 * 60 * 1000;

    if (data.status === 'reset') {
      var wasRequest = existing && existing.type === 'request';
      entries = entries.filter(function(e) { return e.id !== data.id; });
      // If heading to this table, cancel the bar
      if (headingToId === data.id) {
        stopCountdown();
        headingToId = null;
        setHeadingTable(null);
        document.getElementById('heading-bar').style.display = 'none';
      }
      // Only show cancel notice if the table was actively in the queue
      if (wasRequest) {
        var tableLabel = 'Table ' + (data.table || (existing && existing.table) || '?');
        showCancelNotice(tableLabel, data.id, 5 * 60 * 1000);
      }
      updatePositions();
      return;
    }

    if (data.status === 'scanned') {
      if (!existing) {

        // Only add if scan is less than 5 minutes old
        if (Date.now() - scannedAt < FIVE_MIN) {
          entries.push({ id: data.id, table: data.table, label: label, type: 'scan', requestedAt: null, scannedAt: scannedAt });
        }
      }

    } else if (data.status === 'requested') {
      if (existing && existing.type === 'scan') {
        existing.type = 'request';
        existing.requestedAt = data.requestedAt ? data.requestedAt.toMillis() : Date.now();
        entries = entries.filter(function(e) { return e.id !== data.id; });
        entries.push(existing);
      } else if (!existing) {
        entries.push({ id: data.id, table: data.table, label: label, type: 'request', requestedAt: data.requestedAt ? data.requestedAt.toMillis() : Date.now() });
      }
      playAlert();
      updatePositions();

    } else if (data.status === 'on_my_way') {
      entries = entries.filter(function(e) { return e.id !== data.id; });
      updatePositions();
      // Restore countdown bar if page was reloaded mid-performance
      if (data.onMyWayAt && !countdownInterval) {
        var startedAt = data.onMyWayAt.toMillis();
        var timerMs = (data.timerMins || TIMER_MINS) * 60 * 1000;
        if (Date.now() - startedAt < timerMs) {

          document.getElementById('heading-bar-table').textContent = label;

          setHeadingTable(String(data.table));

    }
  }

  function showCancelNotice(label, id, remainingMs) {

    el.setAttribute('data-cancel-id', id);
    el.textContent = label + ' — Cancelled Request';
    document.getElementById('cancel-notices').appendChild(el);
    setTimeout(function() {
      el.style.opacity = '0';
      setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
    }, remainingMs);
  }

  function updatePositions() {
    if (!settings.activeVenue) return;
    entries.filter(function(e) { return e.type === 'request'; }).forEach(function(e, i) {
      db.collection('venues').doc(settings.activeVenue).collection('tables').doc(e.id)
        .update({ queuePosition: i + 1 }).catch(function() {});
    });
  }

  function renderQueue() {
    var list = document.getElementById('queue-list');
    var count = document.getElementById('queue-count');
    var FIVE_MIN = 5 * 60 * 1000;

    // Filter expired scans
    entries = entries.filter(function(e) {
      return !(e.type === 'scan' && e.scannedAt && Date.now() - e.scannedAt > FIVE_MIN);
    });

    var requests = entries.filter(function(e) { return e.type === 'request'; });
    var scans    = entries.filter(function(e) { return e.type === 'scan'; });
    var sorted   = requests.concat(scans);
    var top      = requests[0] || null;
    queueTop = top; followFocus();

    count.textContent = requests.length;
    count.className = 'queue-count' + (requests.length === 0 ? ' empty' : '');

    if (!sorted.length) { list.innerHTML = '<div class="queue-empty">No activity yet.</div>'; return; }

    list.innerHTML = '';
    sorted.forEach(function(entry) {
      var isTop = entry === top;
      var div = document.createElement('div');
      div.className = 'queue-entry' + (isTop ? ' is-top' : '');

      if (entry.type === 'request') {
        var ms = entry.requestedAt ? Date.now() - entry.requestedAt : 0;
        var waitStr = fmtTime(ms);
        div.innerHTML =
          '<div class="entry-left">' +
            '<div class="entry-name">' + entry.label + '</div>' +
            '<div class="entry-wait">Waiting ' + waitStr + '</div>' +
          '</div>' +
          (isTop ? '<button class="on-my-way-btn" data-id="' + entry.id + '" data-label="' + entry.label + '" data-requested="' + (entry.requestedAt || '') + '">On my way</button>' : '');
      } else {
        div.innerHTML = '<div class="entry-left"><div class="entry-name scan">' + entry.label + ' — Scan</div></div>';
      }
      list.appendChild(div);
    });

    var btn = list.querySelector('.on-my-way-btn');
    if (btn) {
      btn.addEventListener('click', function() {
        var id = this.dataset.id;
        var lbl = this.dataset.label;
        var requestedAt = this.dataset.requested ? parseInt(this.dataset.requested) : null;
        var timerMs = TIMER_MINS * 60 * 1000;

        headingToId = id;
        setHeadingTable(id.replace('table_', ''));

        // Write to Firebase — diner page reads onMyWayAt and handles its own transition
        db.collection('venues').doc(settings.activeVenue).collection('tables').doc(id)
          .update({ status: 'on_my_way', onMyWayAt: FS.serverTimestamp(), timerMins: TIMER_MINS });

        logEvent('performance', id.replace('table_', ''), requestedAt);

        // Show heading bar — countdown calculates from local time
        // (will be corrected to server time once Firebase confirms onMyWayAt)
        var localStart = Date.now();
        document.getElementById('heading-bar').style.display = 'flex';
        document.getElementById('heading-bar-table').textContent = lbl;
        startCountdown(localStart, timerMs);

        // Once Firebase confirms the server timestamp, restart with accurate time
        db.collection('venues').doc(settings.activeVenue).collection('tables').doc(id)
          .get().then(function(s) {
            if (s.exists && s.data().onMyWayAt && s.data().status === 'on_my_way') {
              startCountdown(s.data().onMyWayAt.toMillis(), timerMs);
            }
          }).catch(function() {});

        updatePositions();
        renderQueue();
      });
    }
  }

  // Refresh wait times every second
  setInterval(function() {
    if (entries.some(function(e) { return e.type === 'request'; })) renderQueue();
  }, 1000);

  // ─── END NIGHT ──────────────────────────────────────────────────────────────
  // ─── SESSION CONTROL (Begin / Finish Performing) ───────────────────────────
  function updateSessionUI() {
    var btn = document.getElementById('session-toggle-btn');
    var label = document.getElementById('session-status-label');
    var v = venues.find(function(v) { return v.slug === settings.activeVenue; });
    if (!v) {
      btn.disabled = true;
      btn.className = 'session-btn off';
      btn.textContent = 'Begin Performing';
      label.textContent = '';
      return;
    }
    btn.disabled = false;
    if (v.sessionActive) {
      btn.className = 'session-btn on';
      btn.textContent = 'Finish Performing';
      label.textContent = 'Open to new requests.';
    } else {
      btn.className = 'session-btn off';
      btn.textContent = 'Begin Performing';
      label.textContent = 'Not accepting new requests.';
    }
  }

  function logSessionEvent(type) {
    db.collection('venueEvents').doc(settings.activeVenue).collection('events')
      .doc(Date.now() + '_' + type)
      .set({ type: type, timestamp: FS.serverTimestamp() }).catch(function() {});
  }

  document.getElementById('session-toggle-btn').addEventListener('click', function() {
    var v = venues.find(function(v) { return v.slug === settings.activeVenue; });
    if (!v) return;
    var goingActive = !v.sessionActive;
    db.collection('venues').doc(v.slug).update({ sessionActive: goingActive }).then(function() {
      v.sessionActive = goingActive;
      logSessionEvent(goingActive ? 'session_start' : 'session_end');
      updateSessionUI();
    }).catch(function() {
      alert('Could not update. Check your connection and try again.');
    });
  });

  // ─── PERFORMER PROFILE (name + logo, one per account) ─────────────────────
  var performerLogoFile = null;
  var performerRemoveLogo = false;

  document.getElementById('signout-btn').addEventListener('click', function() {
    firebase.auth().signOut();
  });
  firebase.auth().onAuthStateChanged(function(user) {
    if (!user) { window.location.replace('login.html'); return; }
    currentUser = user;
    document.getElementById('account-email').textContent = user.email;
    document.body.classList.remove('pending');
    loadVenues();
    updatePushStatus();
    maybeShowPushPrompt();
  });
</script>
</body>
</html>
